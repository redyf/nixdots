name: Flake Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flake-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cache-nix-action purges old caches.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      # Runs every check in flake.nix:
      # - formatting: treefmt (nixfmt + statix) must leave the tree unchanged
      # - home-configurations: every <user>@<host> Home Manager config evaluates
      # plus the built-in evaluation of every nixosConfiguration.
      - name: Flake check
        run: nix flake check --show-trace
